name: CI

on:
  pull_request:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/cache/restore@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
      - name: Install Dependencies
        run: bun ci
      - name: Lint
        run: bunx ultracite check
      - name: Log Gate
        run: bash scripts/check-log-gate.sh

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/cache/restore@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
      - name: Install Dependencies
        run: bun ci
      - name: Typecheck
        run: bun run check-types

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/cache/restore@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
      - name: Install Dependencies
        run: bun ci
      - name: Unit Tests
        run: bun test

  build:
    name: Build / Compile
    needs: [lint, typecheck, unit-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/cache/restore@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
      - uses: actions/cache/restore@v5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ github.ref_name }}-
            ${{ runner.os }}-turbo-
      - name: Install Dependencies
        run: bun ci
      - name: Build
        run: bun run build

  integration-tests:
    name: Integration Tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/cache/restore@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
      - name: Install Dependencies
        run: bun ci
      - name: Serve Smoke
        run: |
          # Phase 4 made every route except GET /health and the login screen
          # require a session cookie, so this smoke logs in first. CHORUS_TOKEN is
          # pinned rather than left to auto-generation so the run is
          # deterministic and the token file is not written into the runner HOME.
          export CHORUS_TOKEN="$(openssl rand -hex 32)"
          export DATA_DIR="$(mktemp -d)"
          OPENCODE_AUTO_START=false PORT=2100 bun run --cwd apps/serve dev &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            curl -sf http://localhost:2100/health > /dev/null && break
            sleep 1
            if [ "$i" = "30" ]; then echo "serve did not become healthy"; exit 1; fi
          done
          trap 'kill $SERVER_PID' EXIT

          # /health is the one route that stays open (spec §6.1).
          curl -sf http://localhost:2100/health | grep -q '"status":"ok"'

          # Everything else is gated, so an unauthenticated call must be
          # rejected before validation runs — which is why /tasks answers 401
          # here rather than 422: a 422 would mean the payload schema leaked.
          GATED=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:2100/workspace)
          [ "$GATED" = "401" ] || { echo "expected 401 unauthenticated on /workspace, got $GATED"; exit 1; }

          LOGIN=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:2100/auth/login \
            -H 'content-type: application/json' -d "{\"token\":\"$CHORUS_TOKEN\"}")
          [ "$LOGIN" = "200" ] || { echo "expected 200 on login, got $LOGIN"; exit 1; }

          COOKIE=$(curl -sf -D - -o /dev/null -X POST http://localhost:2100/auth/login \
            -H 'content-type: application/json' -d "{\"token\":\"$CHORUS_TOKEN\"}" \
            | grep -i '^set-cookie:' | sed 's/^[Ss]et-[Cc]ookie: *//' | cut -d';' -f1 | tr -d '\r')

          # Sent as an explicit header: the cookie is Secure, so curl correctly
          # refuses to attach it over plain HTTP. TLS arrives with Caddy in P8.
          curl -sf -H "Cookie: $COOKIE" http://localhost:2100/workspace | grep -q '"revision"'

          CODE=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:2100/tasks \
            -H 'content-type: application/json' -H "Cookie: $COOKIE" -d '{}')
          [ "$CODE" = "422" ] || { echo "expected 422 for invalid task payload, got $CODE"; exit 1; }

          FORGED=$(curl -s -o /dev/null -w '%{http_code}' -H 'Cookie: chorus_session=v1.deadbeef.zz' http://localhost:2100/workspace)
          [ "$FORGED" = "401" ] || { echo "expected 401 for a forged cookie, got $FORGED"; exit 1; }

          echo "integration smoke passed"

  security:
    name: Security Checks
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Secret Scan (gitleaks)
        # gitleaks-action@v2 requires a paid license for orgs; run the OSS binary directly.
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --source . --redact --verbose

  docker-build:
    name: Docker Build
    needs: [build, integration-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Detect Dockerfile
        id: detect
        run: |
          if [ -f Dockerfile ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No Dockerfile yet — skipping (activates with deployment phase)"
          fi
      - uses: docker/setup-buildx-action@v3
        if: steps.detect.outputs.exists == 'true'
      - uses: docker/build-push-action@v6
        if: steps.detect.outputs.exists == 'true'
        with:
          context: .
          push: false
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  ci-result:
    name: CI Result
    needs:
      - lint
      - typecheck
      - unit-tests
      - build
      - integration-tests
      - security
      - docker-build
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aggregate Results
        run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ] || \
             [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "CI FAILED"
            exit 1
          fi
          echo "CI PASSED"
