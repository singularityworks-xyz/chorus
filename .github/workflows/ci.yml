name: CI

on:
  pull_request:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/cache/restore@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
      - name: Install Dependencies
        run: bun ci
      - name: Lint
        run: bunx ultracite check

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/cache/restore@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
      - name: Install Dependencies
        run: bun ci
      - name: Typecheck
        run: bun run check-types

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/cache/restore@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
      - name: Install Dependencies
        run: bun ci
      - name: Unit Tests
        run: bun test

  build:
    name: Build / Compile
    needs: [lint, typecheck, unit-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/cache/restore@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
      - uses: actions/cache/restore@v5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ github.ref_name }}-
            ${{ runner.os }}-turbo-
      - name: Install Dependencies
        run: bun ci
      - name: Build
        run: bun run build

  integration-tests:
    name: Integration Tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/cache/restore@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
      - name: Install Dependencies
        run: bun ci
      - name: Serve Smoke
        run: |
          OPENCODE_AUTO_START=false PORT=2100 bun run --cwd apps/serve dev &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            curl -sf http://localhost:2100/health > /dev/null && break
            sleep 1
            if [ "$i" = "30" ]; then echo "serve did not become healthy"; exit 1; fi
          done
          trap 'kill $SERVER_PID' EXIT

          curl -sf http://localhost:2100/health | grep -q '"status":"ok"'
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:2100/tasks \
            -H 'content-type: application/json' -d '{}')
          [ "$CODE" = "422" ] || { echo "expected 422 for invalid task payload, got $CODE"; exit 1; }
          curl -sf http://localhost:2100/workspace | grep -q '"revision"'
          echo "integration smoke passed"

  security:
    name: Security Checks
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Secret Scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-build:
    name: Docker Build
    needs: [build, integration-tests]
    if: ${{ hashFiles('Dockerfile') != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  ci-result:
    name: CI Result
    needs:
      - lint
      - typecheck
      - unit-tests
      - build
      - integration-tests
      - security
      - docker-build
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aggregate Results
        run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ] || \
             [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "CI FAILED"
            exit 1
          fi
          echo "CI PASSED"
